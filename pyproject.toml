[project]
name = "bordeus-workspace"
version = "0.2.0"
description = "Radice del workspace uv: raggruppa common/, ingestion/ e bot/. Non è un pacchetto installabile a sé — vedi la nota sotto."
license = "MIT"
requires-python = ">=3.11"
dependencies = []

# Nessun [build-system] qui deliberatamente: questa radice non ha codice
# proprio da costruire (nessun src/bordeus_workspace/), è solo il
# contenitore del workspace. Con un [build-system] uv la tratterebbe come
# un pacchetto installabile e "uv sync" fallirebbe cercando un modulo
# inesistente. Per installare i membri: "uv sync --all-packages" (o
# "uv sync --package <nome>" per uno solo) da questa cartella, oppure il
# solito "uv sync" dentro common/, ingestion/ o bot/.

[tool.uv.workspace]
members = ["common", "ingestion", "bot"]

# GPU: sia la pipeline di ingestion sia il bot calcolano embedding con lo
# stesso modello (microsoft/harrier-oss-v1-0.6b, via
# bordeus_ingest.embed.get_embeddings) sulla stessa macchina con NVIDIA
# GTX 1080 (Pascal, compute capability 6.1). Dichiarare la sorgente di
# `torch` una volta sola qui, a livello di workspace, garantisce che
# ENTRAMBI i progetti risolvano esattamente la stessa build — importante
# non solo per la GPU, ma perché build diverse di torch potrebbero (in
# teoria) produrre embedding non bit-per-bit identici a parità di
# modello: ingestion scrive i chunk, il bot ci fa la similarity search
# sopra, devono vivere nello stesso spazio vettoriale.
#
# Due vincoli da rispettare insieme, altrimenti torch.cuda.is_available()
# sembra funzionare ma il primo tensore sulla GPU fallisce con "no kernel
# image is available for execution":
#
# 1. torch <2.8 — dalla 2.8 PyTorch ha smesso di includere i kernel per
#    Maxwell/Pascal/Volta nelle build precompilate (vedi pin in
#    common/pyproject.toml — dipendenza diretta lì, non più in
#    ingestion/ o bot/, che la ricevono transitivamente).
# 2. build CUDA <=12.6 — CUDA 12.8/12.9 hanno rimosso il supporto Pascal
#    anche lato toolkit; puntiamo quindi all'indice cu126 invece che a
#    quello di default (che oggi punta a una build CUDA più recente).
#
# Se in futuro sostituisci la GPU con una più recente (Turing o più
# nuova), alza il pin di torch in common/pyproject.toml e cambia l'indice
# qui sotto. Per tornare a una build CPU-only (es. sviluppo locale senza
# GPU), sostituisci l'url con "https://download.pytorch.org/whl/cpu".
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


# Configurazione ruff per l'intero workspace (un solo posto, non
# ripetuta in ciascun membro): lint via `uvx ruff check .`, nessuna
# dipendenza del progetto da installare per farlo girare — vedi
# .github/workflows/ci.yml. Regole di default di ruff (pyflakes + un
# sottoinsieme minimo di pycodestyle), non un select esteso: le
# spiegazioni in italiano nei commenti di questo progetto sono
# volutamente lunghe, un limite di lunghezza riga (E501) le
# considererebbe tutte un problema — non è il tipo di controllo utile
# qui.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "I",
] # ordinamento import, oltre ai default (pyflakes + E4/E7/E9)
ignore = [
    # BLE001 ("except Exception troppo generico") non è nemmeno tra i
    # default di ruff selezionati sopra, ma la citiamo comunque qui per
    # chiarezza: questo progetto la usa deliberatamente in più punti
    # (fetch di rete, caricamento file, chiamate LLM) per non far
    # fallire un'intera pipeline/richiesta per un singolo elemento
    # rotto — sempre con un log esplicito accanto (mai un except
    # silenzioso), vedi i commenti nei punti in cui compare. Non è un
    # difetto da correggere, è la linea di resilienza scelta per un
    # bot/pipeline che deve continuare a funzionare anche quando una
    # singola fonte/richiesta fallisce.
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
# I notebook mescolano celle indipendenti (spesso con lo stesso nome di
# variabile riusato tra celle, es. `conn`, `docs`) — F811 (redefinition)
# darebbe falsi positivi strutturali, non bug reali.
"*.ipynb" = ["F811"]

# python-semantic-release: calcola la prossima versione dai Conventional
# Commits, aggiorna CHANGELOG.md, crea tag e release GitHub — vedi
# .github/workflows/ci.yml, job "release". Da qui in poi CHANGELOG.md è
# gestito da questo strumento (rigenerato dalla cronologia commit ad
# ogni release), non più scritto a mano.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"

# Verificato empiricamente (non solo dalla documentazione) contro un
# repository di prova: con major_on_zero = false, un commit con
# BREAKING CHANGE a partire da v0.1.0 produce v0.2.0 (bump minor), non
# v1.0.0 — coerente con "resta in 0.x finché il progetto è un PoC" (vedi
# README, sezione "Sviluppi futuri"). Senza questa riga (comportamento
# di default sia di python-semantic-release sia di semantic-release/JS)
# salterebbe direttamente a v1.0.0 al primo breaking change, comunicando
# una stabilità che il progetto non ha ancora.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
