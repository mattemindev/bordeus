[project]
name = "bordeus-ingest"
version = "0.1.0"
description = "Ingestion semi-automatica per bordeus: fonti del gestore -> Markdown curato -> vector store (RAG) + tabella delle date di raccolta"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # langchain-community non serve più: i loader HTML/PDF
    # (BSHTMLLoader/PDFPlumberLoader/TextLoader) erano necessari quando la
    # pipeline scaricava e caricava fonti eterogenee. Ora ogni fonte è
    # Markdown curato, e leggerlo è read_text().
    "langchain-core>=1.0",
    "langchain-text-splitters>=0.3.0",
    # Estrazione del vocabolario dal PDF del riciclabolario
    # (extract/vocabolario.py). `pages=[...]` limita l'apertura alle sole
    # pagine richieste, quindi copre sia la lettura completa sia
    # un'anteprima veloce senza una seconda libreria.
    "pdfplumber>=0.11",
    # Estrazione del calendario da immagine (extract/calendario.py) via un
    # endpoint OpenAI-compatibile — Ollama in locale o un provider remoto,
    # a scelta con le variabili d'ambiente INGEST_VISION_*.
    "openai>=1.40",
    "pydantic>=2.7",
    # <0.4: langchain-postgres (qualunque versione >=0.0.12) richiede
    # pgvector<0.4 — vincolo verificato risolvendo il workspace, non
    # scelto a caso. Dipendenza diretta anche qui (non solo in common)
    # perché viz.py usa pgvector.psycopg direttamente per la lettura a
    # scopo di visualizzazione.
    "pgvector>=0.2.5,<0.4",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    # Solo per scaricare il PDF del riciclabolario quando gli si passa un
    # URL invece di un percorso locale (extract/vocabolario.py).
    "requests>=2.34.2",
    "tqdm>=4.70.0",
    # Embedding (embed.py), vector store (vectorstore.py) e accesso alla
    # tabella dei calendari (calendario.py) sono condivisi con il bot:
    # vivono in bordeus-common. torch/sentence-transformers/
    # langchain-huggingface/langchain-postgres arrivano transitivamente
    # da lì.
    "bordeus-common",
]

# Rimosse in questa versione, dopo che la sperimentazione nei notebook ha
# scelto un'altra strada: unstructured[all-docs,local-inference],
# paddleocr, paddlepaddle, rapidocr, pymupdf, pillow-heif erano tutte
# tentativi di leggere il calendario con OCR/layout analysis. Nessuno
# funzionava: quei calendari sono griglie in cui la posizione della cella
# nella colonna È l'informazione (il giorno del mese), e un OCR restituisce
# il testo avendo perso proprio quella. La strada scelta è un modello
# multimodale con output strutturato, che legge la griglia come griglia —
# e che come dipendenza costa un client HTTP invece di alcuni GB di ruote
# con CUDA e modelli di layout al seguito.
# beautifulsoup4/lxml sono cadute con il crawl HTML: non c'è più nessuna
# pagina web da parsare.

[project.scripts]
bordeus-ingest = "bordeus_ingest:main"

[tool.uv.sources]
bordeus-common = { workspace = true }

# Dipendenze di sviluppo: notebook (ipykernel/jupyterlab) e visualizzazione
# (matplotlib/scikit-learn, usate solo da viz.py — vedi gli import lazy lì
# dentro). `uv sync` le installa di default; `uv sync --no-dev` dà
# un'installazione minima adatta a un ambiente che deve solo eseguire
# `bordeus-ingest` da riga di comando (es. un job schedulato), senza il
# peso di Jupyter/matplotlib/scikit-learn.
[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "ipywidgets>=6.29",
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
